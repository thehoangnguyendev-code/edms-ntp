# Production reverse-proxy in front of frontend (3000) and backend (5000). Adds edge-level
# request-size/timeout/connection shaping and a place to terminate TLS -- it does not replace the
# app-level Redis rate limiter (RateLimiterService), it's a coarser first line of defense against
# connection floods before a request ever reaches Spring/Tomcat.
#
# Rollback: this service is additive (docker-compose.gmp.yml, opt-in via -f). To roll back, stop
# routing traffic here and point clients back at the frontend (3000)/backend (5000) ports directly
# -- nothing about those services changes because this proxy exists.

worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65;

    # Must be >= the backend's multipart limits (application.properties:
    # SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE / SERVER_TOMCAT_MAX_HTTP_FORM_POST_SIZE = 150MB)
    # -- a smaller value here would silently reject uploads the backend would otherwise accept.
    client_max_body_size 150m;

    gzip on;
    gzip_types text/plain application/json application/javascript text/css application/xml;
    gzip_min_length 2048;

    # Edge-level connection/request shaping -- deliberately generous (this is a floor against
    # abusive floods, not the primary throttle; APP_RATE_LIMIT_* via Redis is the real per-user/
    # per-IP/per-endpoint budget and stays authoritative).
    limit_conn_zone $binary_remote_addr zone=perip_conn:10m;
    limit_req_zone $binary_remote_addr zone=perip_req:10m rate=50r/s;

    upstream eqms_frontend {
        server frontend:3000;
        keepalive 64;
    }

    upstream eqms_backend {
        server backend:5000;
        keepalive 64;
    }

    server {
        listen 80;
        server_name _;

        limit_conn perip_conn 50;
        limit_req zone=perip_req burst=100 nodelay;

        # SSE notification stream: must not be buffered, and needs a long read timeout since the
        # connection is intentionally long-lived (NotificationRealtimeService, ~45min bound).
        location /api/notifications/stream {
            proxy_pass http://eqms_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
        }

        location /api/ {
            proxy_pass http://eqms_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        location / {
            proxy_pass http://eqms_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }

    # TLS termination point -- add a `listen 443 ssl;` server block here once certificates are
    # provisioned for the target domain (e.g. via a bind-mounted cert/key pair or an ACME sidecar).
    # Left out by default so this file works out of the box without requiring certs to exist.
}
