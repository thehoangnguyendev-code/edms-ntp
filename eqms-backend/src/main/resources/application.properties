spring.application.name=eqms-backend
server.port=${SERVER_PORT:5000}
server.servlet.context-path=/api
server.max-http-request-header-size=${SERVER_MAX_HTTP_REQUEST_HEADER_SIZE:64KB}
server.tomcat.connection-timeout=${SERVER_TOMCAT_CONNECTION_TIMEOUT:5m}
spring.config.import=optional:file:.env[.properties]

# Tomcat sizing for concurrent load. threads.max is deliberately kept close to
# (hikari.maximum-pool-size + async/SSE headroom) rather than Tomcat's 200-thread default, so a
# traffic spike can't queue far more requests than the DB pool could ever service anyway -- that
# just moves the bottleneck from "slow" to "thread pool exhausted", it doesn't remove it.
server.tomcat.threads.max=${SERVER_TOMCAT_THREADS_MAX:100}
server.tomcat.threads.min-spare=${SERVER_TOMCAT_THREADS_MIN_SPARE:20}
server.tomcat.accept-count=${SERVER_TOMCAT_ACCEPT_COUNT:100}
server.tomcat.max-connections=${SERVER_TOMCAT_MAX_CONNECTIONS:8192}

# Graceful shutdown: let in-flight requests finish (bounded) instead of the JVM cutting them off
# immediately on SIGTERM (container restart/redeploy). Same timeout budget backs both the HTTP
# request-completion phase and Spring's own shutdown phase.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE:30s}

# Upload / payload limits. GMP documents (scanned PDFs, bundled evidence) can be large,
# so limits are generous but bounded to prevent unbounded/oversized request abuse.
spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:100MB}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:150MB}
server.tomcat.max-swallow-size=${SERVER_TOMCAT_MAX_SWALLOW_SIZE:150MB}
server.tomcat.max-http-form-post-size=${SERVER_TOMCAT_MAX_HTTP_FORM_POST_SIZE:150MB}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/eqms-database}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:eqms}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:eqms}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:50}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:10}
spring.datasource.hikari.connection-timeout=${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.validation-timeout=${SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT:5000}
spring.datasource.hikari.leak-detection-threshold=${SPRING_DATASOURCE_HIKARI_LEAK_DETECTION_THRESHOLD:60000}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.jdbc.batch_size=${SPRING_JPA_HIBERNATE_JDBC_BATCH_SIZE:50}
spring.jpa.properties.hibernate.default_batch_fetch_size=${SPRING_JPA_HIBERNATE_DEFAULT_BATCH_FETCH_SIZE:50}

server.compression.enabled=${SERVER_COMPRESSION_ENABLED:true}
server.compression.mime-types=application/json,application/*+json,text/plain,text/html,text/css,application/javascript
server.compression.min-response-size=${SERVER_COMPRESSION_MIN_RESPONSE_SIZE:2048}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.mvc.async.request-timeout=${SPRING_MVC_ASYNC_REQUEST_TIMEOUT:900000}
spring.task.execution.pool.core-size=${SPRING_TASK_EXECUTION_POOL_CORE_SIZE:4}
spring.task.execution.pool.max-size=${SPRING_TASK_EXECUTION_POOL_MAX_SIZE:8}
spring.task.execution.pool.queue-capacity=${SPRING_TASK_EXECUTION_POOL_QUEUE_CAPACITY:100}
spring.task.execution.thread-name-prefix=${SPRING_TASK_EXECUTION_THREAD_NAME_PREFIX:eqms-async-}
# @Scheduled jobs (notification digest/escalation, controlled-copy expiry scan, report worker...)
# previously shared Spring's single-thread default scheduler, so one slow job could delay every
# other scheduled job behind it. A small dedicated pool lets them run independently.
spring.task.scheduling.pool.size=${SPRING_TASK_SCHEDULING_POOL_SIZE:6}
spring.task.scheduling.thread-name-prefix=${SPRING_TASK_SCHEDULING_THREAD_NAME_PREFIX:eqms-sched-}

app.auth.issuer=eqms-backend
app.auth.access-token-ttl-minutes=60
app.auth.refresh-token-ttl-days=30
app.auth.login-challenge-ttl-minutes=5
app.auth.signature-token-ttl-minutes=5
app.auth.jwt-secret=${APP_AUTH_JWT_SECRET:EQMS_DEV_AUTH_SECRET_CHANGE_ME_32_BYTES_MINIMUM_KEY}
app.public-url=${APP_PUBLIC_URL:http://localhost:3000}
app.security.cookies-secure=${APP_SECURITY_COOKIES_SECURE:false}

# Phase 1-2.5 hybrid authorization engine cutover (SECURITY_AUTHORIZATION_HYBRID_REFACTOR_PLAN.md
# §7 rule 3). Comma-separated resource types (e.g. "REVISION,DOCUMENT") whose real enforcement
# decision comes from AuthorizationEngineService instead of the legacy evaluator. Empty by
# default -- every resource type stays on the legacy evaluator until explicitly enabled here.
app.authorization.hybrid-engine.enabled-resource-types=${APP_AUTHORIZATION_HYBRID_ENGINE_ENABLED_RESOURCE_TYPES:}

# Uploads are scanned before storage. Scanning is enabled by default and fails closed when ClamAV
# is unavailable. A developer may opt out only through an explicit local environment override.
app.security.virus-scan.enabled=${APP_SECURITY_VIRUS_SCAN_ENABLED:true}
app.security.virus-scan.host=${APP_SECURITY_VIRUS_SCAN_HOST:clamav}
app.security.virus-scan.port=${APP_SECURITY_VIRUS_SCAN_PORT:3310}
app.security.virus-scan.timeout-ms=${APP_SECURITY_VIRUS_SCAN_TIMEOUT_MS:15000}

# Per-client API throttling. Configure APP_RATE_LIMIT_TRUST_FORWARDED_HEADERS=true
# only when the application is behind a reverse proxy that overwrites X-Forwarded-For.
# Independent budgets prevent normal list/detail reads and background polling
# from exhausting the quota reserved for user-initiated writes.
app.rate-limit.read.max-requests=${APP_RATE_LIMIT_READ_MAX_REQUESTS:900}
app.rate-limit.read.window-seconds=${APP_RATE_LIMIT_READ_WINDOW_SECONDS:60}
app.rate-limit.write.max-requests=${APP_RATE_LIMIT_WRITE_MAX_REQUESTS:180}
app.rate-limit.write.window-seconds=${APP_RATE_LIMIT_WRITE_WINDOW_SECONDS:60}
app.rate-limit.polling.max-requests=${APP_RATE_LIMIT_POLLING_MAX_REQUESTS:120}
app.rate-limit.polling.window-seconds=${APP_RATE_LIMIT_POLLING_WINDOW_SECONDS:60}
app.rate-limit.auth.max-attempts=${APP_RATE_LIMIT_AUTH_MAX_ATTEMPTS:5}
app.rate-limit.auth.window-seconds=${APP_RATE_LIMIT_AUTH_WINDOW_SECONDS:900}
app.rate-limit.trust-forwarded-headers=${APP_RATE_LIMIT_TRUST_FORWARDED_HEADERS:false}
# Redis is the default shared limiter store for multi-instance deployments. Set
# APP_RATE_LIMIT_REDIS_ENABLED=false only for an explicitly single-node/local run.
app.rate-limit.redis.enabled=${APP_RATE_LIMIT_REDIS_ENABLED:true}
app.idempotency.redis.enabled=${APP_IDEMPOTENCY_REDIS_ENABLED:${APP_RATE_LIMIT_REDIS_ENABLED:false}}
# Required for multi-instance scheduled jobs. Disable only for an explicitly
# single-instance/local deployment; when enabled but Redis is unavailable the
# protected job is skipped to prevent duplicate regulated actions.
app.scheduler-lock.redis.enabled=${APP_SCHEDULER_LOCK_REDIS_ENABLED:${APP_RATE_LIMIT_REDIS_ENABLED:true}}
spring.data.redis.url=${SPRING_DATA_REDIS_URL:redis://localhost:6379}
spring.cache.type=${SPRING_CACHE_TYPE:none}
spring.cache.redis.time-to-live=${SPRING_CACHE_REDIS_TTL:30s}
management.health.redis.enabled=${APP_RATE_LIMIT_REDIS_ENABLED:false}

app.minio.enabled=${APP_MINIO_ENABLED:true}
app.minio.initialize-on-startup=${APP_MINIO_INITIALIZE_ON_STARTUP:false}
app.minio.endpoint=${APP_MINIO_ENDPOINT:http://localhost:9000}
app.minio.access-key=${APP_MINIO_ACCESS_KEY:eqms-minio}
app.minio.secret-key=${APP_MINIO_SECRET_KEY:eqms-minio-secret}
app.minio.bucket=${APP_MINIO_BUCKET:eqms-gmp-revisions}
app.minio.documents-prefix=${APP_MINIO_DOCUMENTS_PREFIX:documents}
app.minio.controlled-copies-prefix=${APP_MINIO_CONTROLLED_COPIES_PREFIX:controlled-copies}
app.minio.templates-prefix=${APP_MINIO_TEMPLATES_PREFIX:templates}
app.minio.training-prefix=${APP_MINIO_TRAINING_PREFIX:training}
app.minio.audit-prefix=${APP_MINIO_AUDIT_PREFIX:audit}
app.minio.temp-prefix=${APP_MINIO_TEMP_PREFIX:temp}
app.minio.retention-years=${APP_MINIO_RETENTION_YEARS:5}

app.microsoft-graph.enabled=${APP_MICROSOFT_GRAPH_ENABLED:${MICROSOFT_GRAPH_ENABLED:true}}
app.microsoft-graph.base-url=${APP_MICROSOFT_GRAPH_BASE_URL:${MICROSOFT_GRAPH_BASE_URL:https://graph.microsoft.com/v1.0}}
app.microsoft-graph.tenant-id=${APP_MICROSOFT_GRAPH_TENANT_ID:${MICROSOFT_GRAPH_TENANT_ID:}}
app.microsoft-graph.client-id=${APP_MICROSOFT_GRAPH_CLIENT_ID:${MICROSOFT_GRAPH_CLIENT_ID:}}
app.microsoft-graph.client-secret=${APP_MICROSOFT_GRAPH_CLIENT_SECRET:${MICROSOFT_GRAPH_CLIENT_SECRET:}}
app.microsoft-graph.site-id=${APP_MICROSOFT_GRAPH_SITE_ID:${MICROSOFT_GRAPH_SITE_ID:}}
app.microsoft-graph.drive-id=${APP_MICROSOFT_GRAPH_DRIVE_ID:${MICROSOFT_GRAPH_DRIVE_ID:}}
app.microsoft-graph.folder-path=${APP_MICROSOFT_GRAPH_FOLDER_PATH:${MICROSOFT_GRAPH_LIBRARY_FOLDER:EQMS}}
app.microsoft-graph.share-link-scope=${APP_MICROSOFT_GRAPH_SHARE_LINK_SCOPE:${MICROSOFT_GRAPH_SHARE_LINK_SCOPE:organization}}
app.microsoft-graph.external-invite-redirect-url=${APP_MICROSOFT_GRAPH_EXTERNAL_INVITE_REDIRECT_URL:${MICROSOFT_GRAPH_EXTERNAL_INVITE_REDIRECT_URL:http://localhost:3000/login}}

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
