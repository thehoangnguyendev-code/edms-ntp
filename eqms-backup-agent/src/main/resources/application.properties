spring.application.name=eqms-backup-agent
server.port=${SERVER_PORT:5600}

# Control database (separate from the eQMS database; see SDS-BR-001 section 3)
spring.datasource.url=${CONTROL_DB_URL:jdbc:postgresql://localhost:5433/eqms_backup_control}
spring.datasource.username=${CONTROL_DB_USER:eqms_backup}
spring.datasource.password=${CONTROL_DB_PASSWORD:}
spring.flyway.locations=classpath:db/control
spring.flyway.validate-on-migrate=true

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

agent.environment=${AGENT_ENVIRONMENT:DEV}
agent.api-token=${AGENT_API_TOKEN:}
agent.zone=${AGENT_ZONE:Asia/Ho_Chi_Minh}
agent.poll-seconds=${AGENT_POLL_SECONDS:5}
agent.min-free-bytes=${AGENT_MIN_FREE_BYTES:1073741824}
agent.ledger-dir=${AGENT_LEDGER_DIR:/backup/ledger}

agent.source.host=${SOURCE_DB_HOST:postgres}
agent.source.port=${SOURCE_DB_PORT:5432}
agent.source.database=${SOURCE_DB_NAME:eqms-database}
agent.source.user=${SOURCE_DB_USER:eqms_backup_ro}
agent.source.password=${SOURCE_DB_PASSWORD:}

agent.targets.t1=${AGENT_TARGET_T1:/backup/t1}

agent.crypto.public-key-file=${AGENT_GPG_PUBLIC_KEY_FILE:/run/secrets/backup_gpg_public.asc}
agent.crypto.signing-key-file=${AGENT_SIGNING_KEY_FILE:/backup/agent/signing.key}
agent.crypto.gpg-home=${AGENT_GPG_HOME:/tmp/agent-gnupg}

agent.tools.pg-dump=${AGENT_PG_DUMP:pg_dump}
agent.tools.gpg=${AGENT_GPG:gpg}

# Role of this process. API (default) serves the eQMS backend and runs backups; RESTORE_WORKER runs restore rehearsals and is the
# only process that may hold the private backup key (SDS 11.5 and 14.1).
agent.role=${AGENT_ROLE:API}
agent.tools.pg-restore=${AGENT_PG_RESTORE:pg_restore}

agent.restore.enabled=${AGENT_RESTORE_ENABLED:false}
agent.restore.gnupg-home=${AGENT_RESTORE_GNUPG_HOME:/restore-keys/gnupg-home}
agent.restore.host=${AGENT_RESTORE_HOST:postgres}
agent.restore.port=${AGENT_RESTORE_PORT:5432}
agent.restore.user=${AGENT_RESTORE_USER:eqms_restore}
agent.restore.password=${AGENT_RESTORE_PASSWORD:}
agent.restore.db-prefix=${AGENT_RESTORE_DB_PREFIX:eqms_restore_}

# Notice length bounds (BR-16: 5 to 240 minutes). A shorter minimum is accepted in DEV only, for testing the countdown.
agent.maintenance.notice-min-minutes=${AGENT_MAINTENANCE_NOTICE_MIN_MINUTES:5}
agent.maintenance.notice-max-minutes=${AGENT_MAINTENANCE_NOTICE_MAX_MINUTES:240}
