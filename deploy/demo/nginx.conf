worker_processes auto;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    server_tokens off;
    log_format dbg '$remote_addr host=$http_host xfh=$http_x_forwarded_host origin=$http_origin "$request" $status';
    access_log /dev/stdout dbg;
    # Keep application upload capability; a tunnel provider may impose a separate smaller limit.
    client_max_body_size 150m;
    map $http_upgrade $upgrade_connection { default upgrade; '' close; }
    map $http_x_forwarded_proto $external_scheme { default $scheme; https https; }
    upstream demo_ui { server demo-frontend:80; }
    upstream demo_api { server backend:5000; }
    upstream demo_office { server onlyoffice-documentserver:80; }
    server {
        listen 80;
        server_name eqms.ngocthien.vn localhost;
        # The public tunnel is HTTPS and this gateway talks to the backend over HTTP, so the backend sees "https://host" as a foreign Origin and answers 403.
        # Only an Origin that is exactly this site is written as the backend's own scheme; any other Origin is passed on unchanged and stays refused by CORS.
        set $demo_origin $http_origin;
        if ($http_origin = "https://$http_host") { set $demo_origin "http://$http_host"; }
        location = /demo-healthz { default_type text/plain; return 200 'ok'; }
        location = /onlyoffice { return 308 /onlyoffice/; }
        # ONLYOFFICE's documented virtual-path proxy. Browser and editor share one HTTPS origin.
        location /onlyoffice/ {
            proxy_pass http://demo_office/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $upgrade_connection;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $http_host/onlyoffice;
            proxy_set_header X-Forwarded-Proto $external_scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }
        location /api/ {
            proxy_pass http://demo_api;
            proxy_set_header Origin $demo_origin;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $external_scheme;
            # Do not accept arbitrary client-provided forwarding chains. Trusted-proxy policy is a separate pre-publication check.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 300s;
        }
        location /pwa/ {
            proxy_pass http://demo_api/api/branding/pwa/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $external_scheme;
        }
        location / {
            proxy_pass http://demo_ui;
            proxy_set_header Host $host;
            proxy_set_header Connection '';
        }
    }
}
