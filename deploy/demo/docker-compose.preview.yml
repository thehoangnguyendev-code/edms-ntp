# Private preparation only. This does not publish a tunnel, change DNS or modify DEV containers.
# Run from the repository root:
# docker compose -f deploy/demo/docker-compose.preview.yml up -d --build
name: eqms-demo-preview
services:
  demo-frontend:
    image: eqms-demo-frontend:local
    build:
      context: ../../eqms
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: /api
        VITE_APP_URL: https://eqms.ngocthien.vn
        VITE_APP_ENV: staging
        VITE_ONLYOFFICE_URL: https://eqms.ngocthien.vn/onlyoffice
    environment:
      API_ORIGIN: https://eqms.ngocthien.vn
      ONLYOFFICE_ORIGIN: https://eqms.ngocthien.vn
    restart: unless-stopped
    networks: [preview]
  demo-gateway:
    image: mirror.gcr.io/library/nginx:1.27-alpine
    ports: ["127.0.0.1:8188:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      demo-frontend:
        condition: service_healthy
    restart: unless-stopped
    networks: [preview, current-stack]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/demo-healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
networks:
  preview: {}
  current-stack:
    external: true
    name: eqms_default
