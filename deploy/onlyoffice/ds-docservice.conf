#welcome page
location = / { return 302 $the_scheme://$the_host$the_prefix/welcome/; }

#script caching protection
location ~ ^(?<cache>\/web-apps\/apps\/(?!api\/documents\/api\.js$).*)$ {
  return 302 $the_scheme://$the_host$the_prefix/9.4.0-$cache_tag$cache$is_args$args;
}

#disable caching for api.js
location ~ ^(\/[\d]+\.[\d]+\.[\d]+[\.|-][\w]+)?\/(web-apps\/apps\/api\/documents\/api\.js)$ {
  expires off;
  add_header Cache-Control "no-store, no-cache, must-revalidate";
  # gzip_static on;
  alias  /var/www/onlyoffice/documentserver/$2;
}

location ~ ^(\/[\d]+\.[\d]+\.[\d]+[\.|-][\w]+)?\/(document_editor_service_worker.js)$ {
  add_header Cache-Control "public, max-age=31536000, immutable" always;
  # gzip_static on;
  alias  /var/www/onlyoffice/documentserver/sdkjs/common/serviceworker/$2;
}

#suppress logging the unsupported locale error in web-apps
location ~ ^(\/[\d]+\.[\d]+\.[\d]+[\.|-][\w]+)?\/(web-apps)(\/.*\.json)$ {
  add_header Cache-Control "public, max-age=31536000, immutable" always;
  error_log /dev/null crit;
  # gzip_static on;
  alias /var/www/onlyoffice/documentserver/$2$3;
}

#suppress logging the unsupported locale error in plugins
location ~ ^(\/[\d]+\.[\d]+\.[\d]+[\.|-][\w]+)?\/(sdkjs-plugins)(\/.*\.json)$ {
  add_header Cache-Control "public, max-age=31536000, immutable" always;
  error_log /dev/null crit;
  # gzip_static on;
  alias /var/www/onlyoffice/documentserver/$2$3;
}

# EQMS: every opening of an editor starts in the Modern Light interface theme (owner decision 2026-11-02). The editor keeps a person's chosen theme in the
# browser (localStorage "ui-theme-id") and that choice wins over the configuration, so a one-line script is written at the top of the editor page, before the
# editor reads it. A person can still pick another theme in View > Interface Theme; it lasts until the editor is opened again. The page is not cached, so a
# change here reaches an open browser at once. Modern Light exists from Document Server 9.0 (id theme-white).
location ~ ^(\/[\d]+\.[\d]+\.[\d]+[\.|-][\w]+)?\/(web-apps)(\/apps\/(documenteditor|spreadsheeteditor|presentationeditor|pdfeditor|visioeditor)\/main\/index\.html)$ {
  alias /var/www/onlyoffice/documentserver/$2$3;
  gzip_static off;
  sub_filter '<head>' '<head><script>try{localStorage.setItem("ui-theme-id","theme-white")}catch(e){}</script>';
  sub_filter_once on;
  add_header Cache-Control "no-cache" always;
}

location ~ ^(\/[\d]+\.[\d]+\.[\d]+[\.|-][\w]+)?\/(web-apps|sdkjs|sdkjs-plugins|fonts|dictionaries)(\/.*)$ {
  add_header Cache-Control "public, max-age=31536000, immutable" always;
  # gzip_static on;
  alias /var/www/onlyoffice/documentserver/$2$3;
}

location ~* ^(\/cache\/files.*)(\/.*) {
  alias /var/lib/onlyoffice/documentserver/App_Data$1;
  add_header Content-Disposition "attachment; filename*=UTF-8''$arg_filename";

  secure_link $arg_md5,$arg_expires;
  secure_link_md5 "$secure_link_expires$uri$secure_link_secret";

  if ($secure_link = "") {
    return 403;
  }

  if ($secure_link = "0") {
    return 410;
  }
}

# Allow "/internal" interface only from 127.0.0.1
# Don't comment out the section below for the security reason!
 location ~* ^(\/[\d]+\.[\d]+\.[\d]+[\.|-][\w]+)?\/(internal)(\/.*)$ {
  allow 127.0.0.1;
  deny all;
  proxy_pass http://docservice/$2$3;
}

# Allow "/info" interface only from 127.0.0.1 by default
# Comment out lines allow 127.0.0.1; and deny all; 
# of below section to turn on the info page
location ~* ^(\/[\d]+\.[\d]+\.[\d]+[\.|-][\w]+)?\/(info)(\/.*)$ {
  allow 127.0.0.1;
  # EQMS backend reads connection usage from here (private docker/LAN ranges only) to warn users
  # before the Community Edition connection limit is reached.
  allow 10.0.0.0/8;
  allow 172.16.0.0/12;
  allow 192.168.0.0/16;
  deny all;
  proxy_pass http://docservice/$2$3;
}

#document formats discovery
location ~ ^(\/[\d]+\.[\d]+\.[\d]+[\.|-][\w]+)?\/(meta\/formats)$ {
  add_header Cache-Control "public, max-age=31536000, immutable" always;
  default_type application/json;
  # gzip_static on;
  alias /var/www/onlyoffice/documentserver/document-formats/onlyoffice-docs-formats.json;
}

location / {
  proxy_pass http://docservice;
  proxy_http_version 1.1;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;
  proxy_connect_timeout 300s;
  proxy_buffering on;
  proxy_buffers 64 32k;
  proxy_busy_buffers_size 64k;
  proxy_max_temp_file_size 0;
  proxy_redirect off;
}

location ~* ^(\/[\d]+\.[\d]+\.[\d]+[\.|-][\w]+)?\/(ai-proxy)(\/.*)?$ {
  proxy_pass http://docservice/$2$3;

  proxy_connect_timeout 300s;
  proxy_send_timeout    300s;
  proxy_read_timeout    300s;
  send_timeout          300s;
}

location ~ ^/([\d]+\.[\d]+\.[\d]+[\.|-][\w]+)/(?<path>.*)$ {
  proxy_pass http://docservice/$path$is_args$args;
  proxy_http_version 1.1;
}


