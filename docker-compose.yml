# Project name, container prefix and published ports come from the environment file (deploy/env/*.env.example).
# Defaults are the DEV values, so a plain `docker compose up` behaves exactly as before.
name: ${EQMS_PROJECT:-eqms}

# Shared bounded log-rotation config -- without this, Docker's default json-file driver keeps
# every log line forever, and at 500-concurrent-user request volume that fills the host disk in
# days, not months. Applied per-service below via YAML anchor (`<<: *default-logging`).
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Docker Desktop/WSL supplies a shared memory pool; it does not reserve this amount
# for every container.  This Compose-side hard limit prevents any one service from
# exhausting that pool.  Override it in .env only when an environment has a justified
# sizing decision (for example: EQMS_SERVICE_MEMORY_LIMIT=2g).
x-default-resources: &default-resources
  mem_limit: ${EQMS_SERVICE_MEMORY_LIMIT:-3g}

services:
  postgres:
    <<: *default-resources
    image: postgres:17-alpine
    container_name: ${EQMS_CONTAINER_PREFIX:-eqms}-postgres
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eqms-database}
      POSTGRES_USER: ${POSTGRES_USER:-eqms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eqms}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - eqms_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eqms} -d ${POSTGRES_DB:-eqms-database}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  adminer:
    <<: *default-resources
    image: adminer:4
    container_name: ${EQMS_CONTAINER_PREFIX:-eqms}-adminer
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8081}:8080"

  minio:
    <<: *default-resources
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: ${EQMS_CONTAINER_PREFIX:-eqms}-minio
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-eqms-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-eqms-minio-secret}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - eqms_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # T3 test target: a second MinIO that backups are copied to. Opt-in (`--profile backup-t3`), DEV and TEST only.
  # Its data, credentials and volume are separate from the document store; the bucket is created with Object Lock by
  # ObjectLockBucketProvisioner, never by the agent at run time. A real T3 sits on another machine or at another provider.
  backup-target-t3:
    <<: *default-resources
    profiles: ["backup-t3"]
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: ${EQMS_CONTAINER_PREFIX:-eqms}-backup-target-t3
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${BACKUP_T3_MINIO_USER:-eqms-t3}
      MINIO_ROOT_PASSWORD: ${BACKUP_T3_MINIO_PASSWORD:?BACKUP_T3_MINIO_PASSWORD is required for the backup-t3 profile}
    ports:
      - "127.0.0.1:${BACKUP_T3_API_PORT:-9100}:9000"
    volumes:
      - eqms_backup_t3_data:/data
    networks:
      - default
      - backup-net
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  onlyoffice-documentserver:
    <<: *default-resources
    # Overrides the shared 3g default: pluginsmanager's startup plugin scan repeatedly got
    # SIGKILL'd by the cgroup OOM killer at 3g (see "Killed" in
    # /var/log/onlyoffice/documentserver/pluginsmanager.log / docker logs), each kill leaving a
    # multi-GB WSL2 crash dump under %LOCALAPPDATA%\Temp\wsl-crashes.
    mem_limit: ${ONLYOFFICE_MEMORY_LIMIT:-5g}
    image: onlyoffice/documentserver:8.2
    container_name: ${EQMS_CONTAINER_PREFIX:-eqms}-onlyoffice
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-EQMS_DEV_ONLYOFFICE_JWT_SECRET_CHANGE_ME}
      JWT_HEADER: Authorization
    ports:
      # Local operator/debug access only -- editor traffic is reached by the frontend
      # iframe/browser directly against this port on the docker host; it stays loopback-bound
      # like every other internal service here (no public HTTPS is required, callbacks stay
      # entirely on the docker-compose network).
      - "127.0.0.1:${ONLYOFFICE_PORT:-8082}:80"
    volumes:
      - eqms_onlyoffice_data:/var/www/onlyoffice/Data
      - eqms_onlyoffice_logs:/var/log/onlyoffice
      # Lets the EQMS backend read /info/info.json (connection usage) from the docker network only.
      - ./deploy/onlyoffice/ds-docservice.conf:/etc/onlyoffice/documentserver/nginx/includes/ds-docservice.conf:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  redis:
    <<: *default-resources
    image: redis:7-alpine
    container_name: ${EQMS_CONTAINER_PREFIX:-eqms}-redis
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - eqms_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  clamav:
    <<: *default-resources
    image: clamav/clamav:stable
    container_name: ${EQMS_CONTAINER_PREFIX:-eqms}-clamav
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    volumes:
      - eqms_clamav_data:/var/lib/clamav
    ports:
      - "127.0.0.1:${CLAMAV_PORT:-3310}:3310"
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      # First boot downloads the virus database, which can take several minutes.
      retries: 10
      start_period: 300s

  mailhog:
    <<: *default-resources
    # NOTIFICATION_SYSTEM_REMEDIATION_PLAN.md Phase 3: dev/test SMTP catcher -- EmailService has
    # no static SMTP config (it's always DB-driven via System Configuration), so without a local
    # catcher there was no way to see real email content in dev without a real external SMTP
    # account. Point System Configuration's SMTP host at "mailhog" / port 1025 (no auth, no TLS)
    # and open http://localhost:8025 to read what was sent.
    image: mailhog/mailhog:v1.0.1
    container_name: ${EQMS_CONTAINER_PREFIX:-eqms}-mailhog
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:${MAILHOG_UI_PORT:-8025}:8025" # web UI
      - "127.0.0.1:${MAILHOG_SMTP_PORT:-1025}:1025" # SMTP

  # ---- Backup & Restore (SDS-BR-001). The control database is separate from the eQMS database on purpose: restoring
  # the eQMS database must never replace the history of backups, restores and approvals.
  backup-control:
    <<: *default-resources
    image: postgres:17-alpine
    container_name: ${EQMS_CONTAINER_PREFIX:-eqms}-backup-control
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: eqms_backup_control
      POSTGRES_USER: eqms_backup
      POSTGRES_PASSWORD: ${BACKUP_CONTROL_DB_PASSWORD:?BACKUP_CONTROL_DB_PASSWORD is required}
    volumes:
      - eqms_backup_control_data:/var/lib/postgresql/data
    networks:
      - backup-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eqms_backup -d eqms_backup_control"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backup-agent:
    <<: *default-resources
    build:
      context: ./eqms-backup-agent
      dockerfile: Dockerfile
      args:
        MAVEN_IMAGE: ${BACKEND_BUILD_IMAGE:-mirror.gcr.io/library/maven:3.9.16-eclipse-temurin-21}
    image: ${EQMS_BACKUP_AGENT_IMAGE:-eqms-backup-agent:local}
    container_name: ${EQMS_CONTAINER_PREFIX:-eqms}-backup-agent
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    depends_on:
      backup-control:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      TZ: Asia/Ho_Chi_Minh
      AGENT_ENVIRONMENT: ${EQMS_ENVIRONMENT:-DEV}
      AGENT_API_TOKEN: ${BACKUP_AGENT_API_TOKEN:?BACKUP_AGENT_API_TOKEN is required}
      CONTROL_DB_URL: jdbc:postgresql://backup-control:5432/eqms_backup_control
      CONTROL_DB_USER: eqms_backup
      CONTROL_DB_PASSWORD: ${BACKUP_CONTROL_DB_PASSWORD:?BACKUP_CONTROL_DB_PASSWORD is required}
      SOURCE_DB_HOST: postgres
      SOURCE_DB_NAME: ${POSTGRES_DB:-eqms-database}
      SOURCE_DB_USER: eqms_backup_ro
      SOURCE_DB_PASSWORD: ${BACKUP_SOURCE_DB_PASSWORD:?BACKUP_SOURCE_DB_PASSWORD is required}
      AGENT_GPG_PUBLIC_KEY_FILE: /run/secrets/backup_gpg_public
      # Document store the agent reads (list versions, read versions; it never writes). DEV uses the MinIO root account; a real
      # deployment must give the agent a read-only service account (SDS section 5, open item in the P2 change record).
      AGENT_OBJECTS_ENABLED: "true"
      AGENT_OBJECTS_ENDPOINT: http://minio:9000
      AGENT_OBJECTS_ACCESS_KEY: ${MINIO_ROOT_USER:-eqms-minio}
      AGENT_OBJECTS_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-eqms-minio-secret}
      AGENT_OBJECTS_BUCKETS: ${BACKUP_OBJECT_BUCKETS:-eqms-gmp-records,eqms-gmp-revisions,eqms-templates}
    secrets:
      - backup_gpg_public
    volumes:
      # T1: a folder on the server. Put it on a different disk from the database in any real deployment.
      - ${BACKUP_T1_DIR:-./backups/dev/t1}:/backup/t1
      - ${BACKUP_LEDGER_DIR:-./backups/dev/ledger}:/backup/ledger
      - ${BACKUP_AGENT_STATE_DIR:-./backups/dev/agent}:/backup/agent
      # Export Backup Set writes one folder per registered offline medium here. In a real deployment this is the mount point of the medium.
      - ${BACKUP_EXPORT_DIR:-./backups/dev/export}:/backup/export
    networks:
      - default
      - backup-net
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:5600/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  backend:
    <<: *default-resources
    build:
      context: ./eqms-backend
      dockerfile: Dockerfile
      args:
        MAVEN_IMAGE: ${BACKEND_BUILD_IMAGE:-mirror.gcr.io/library/maven:3.9.16-eclipse-temurin-21}
    image: ${EQMS_BACKEND_IMAGE:-eqms-backend:local}
    container_name: ${EQMS_CONTAINER_PREFIX:-eqms}-backend
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_started
      onlyoffice-documentserver:
        condition: service_healthy
    environment:
      TZ: Asia/Ho_Chi_Minh
      # DEV | TEST | PROD. Checked at startup and before every storage write (EnvironmentConfigurationValidator).
      APP_ENVIRONMENT: ${EQMS_ENVIRONMENT:-DEV}
      APP_BACKUP_AGENT_URL: http://backup-agent:5600
      APP_BACKUP_AGENT_TOKEN: ${BACKUP_AGENT_API_TOKEN:?BACKUP_AGENT_API_TOKEN is required}
      SERVER_PORT: 5000
      # P3 legacy cleanup: all users are backfilled to Access Profiles (V166/V167)
      APP_SECURITY_LEGACY_ROLE_FALLBACK_ENABLED: "false"
      # Canonical permission codes only. Legacy aliases can be enabled temporarily
      # during a documented migration window, never as the production default.
      APP_SECURITY_COMPATIBILITY_ALIASES_ENABLED: "false"
      # Lifecycle state policy engine (V169 seeds = parity with strict rule)
      APP_SECURITY_LIFECYCLE_POLICY_ENABLED: "true"
      # Phase 1-2.5 / Phase 3 hybrid authorization engine cutover
      # (SECURITY_AUTHORIZATION_HYBRID_REFACTOR_PLAN.md §7 rule 3). Shadow-evaluation confirmed 0
      # mismatches for all four resource types before enabling each. REQUEST_COPY is a documented
      # exclusion (see ControlledCopyResourceAdapter#resolvePolicy) -- unaffected, its real
      # enforcement path (requireRequestControlledCopy) never reaches this adapter's per-copy-id
      # lookup. Rollback: remove this line (or clear the value) and restart -- the legacy
      # evaluators are still fully intact and untouched until cutover rule 5 (Phase 1-2.6/3) deletes them.
      APP_AUTHORIZATION_HYBRID_ENGINE_ENABLED_RESOURCE_TYPES: "REVISION,DOCUMENT,CONTROLLED_COPY,CONTROLLED_COPY_BATCH"
      SERVER_TOMCAT_CONNECTION_TIMEOUT: 5m
      SPRING_MVC_ASYNC_REQUEST_TIMEOUT: 900000
      SPRING_TASK_EXECUTION_POOL_CORE_SIZE: 4
      SPRING_TASK_EXECUTION_POOL_MAX_SIZE: 8
      SPRING_TASK_EXECUTION_POOL_QUEUE_CAPACITY: 100
      LOGGING_FILE_NAME: /app/logs/eqms-backend.log
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-eqms-database}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-eqms}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-eqms}
      APP_AUTH_JWT_SECRET: ${APP_AUTH_JWT_SECRET:-EQMS_DEV_AUTH_SECRET_CHANGE_ME_32_BYTES_MINIMUM_KEY}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
      APP_SECURITY_COOKIES_SECURE: ${APP_SECURITY_COOKIES_SECURE:-false}
      APP_MINIO_ENABLED: "true"
      APP_MINIO_INITIALIZE_ON_STARTUP: "false"
      APP_MINIO_ENDPOINT: http://minio:9000
      APP_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-eqms-minio}
      APP_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-eqms-minio-secret}
      # Dev only: also loads db/migration-dev (V558 bucket switch). Production overlay does not set this.
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/migration-dev
      APP_MINIO_BUCKET: ${APP_MINIO_BUCKET:-eqms-gmp-records}
      APP_MINIO_TEMPLATES_BUCKET: ${APP_MINIO_TEMPLATES_BUCKET:-eqms-templates}
      APP_MINIO_DOCUMENTS_PREFIX: ${APP_MINIO_DOCUMENTS_PREFIX:-documents}
      APP_MINIO_CONTROLLED_COPIES_PREFIX: ${APP_MINIO_CONTROLLED_COPIES_PREFIX:-controlled-copies}
      APP_MINIO_TEMPLATES_PREFIX: ${APP_MINIO_TEMPLATES_PREFIX:-templates}
      APP_MINIO_TRAINING_PREFIX: ${APP_MINIO_TRAINING_PREFIX:-training}
      APP_MINIO_AUDIT_PREFIX: ${APP_MINIO_AUDIT_PREFIX:-audit}
      APP_MINIO_TEMP_PREFIX: ${APP_MINIO_TEMP_PREFIX:-temp}
      APP_RATE_LIMIT_REDIS_ENABLED: ${APP_RATE_LIMIT_REDIS_ENABLED:-true}
      APP_IDEMPOTENCY_REDIS_ENABLED: ${APP_IDEMPOTENCY_REDIS_ENABLED:-true}
      SPRING_DATA_REDIS_URL: redis://redis:6379
      SPRING_CACHE_TYPE: redis
      SPRING_CACHE_REDIS_TTL: 30s
      APP_MINIO_RETENTION_YEARS: ${APP_MINIO_RETENTION_YEARS:-100}
      APP_MICROSOFT_GRAPH_ENABLED: ${APP_MICROSOFT_GRAPH_ENABLED:-true}
      APP_MICROSOFT_GRAPH_BASE_URL: ${APP_MICROSOFT_GRAPH_BASE_URL:-https://graph.microsoft.com/v1.0}
      APP_ONLYOFFICE_ENABLED: ${APP_ONLYOFFICE_ENABLED:-true}
      APP_ONLYOFFICE_DOCUMENT_SERVER_URL: ${APP_ONLYOFFICE_DOCUMENT_SERVER_URL:-http://onlyoffice-documentserver}
      # Must include the /api context path (server.servlet.context-path=/api) -- this is the
      # base URL onlyoffice-documentserver itself uses to fetch the source file and post the
      # save callback, not a browser-facing URL.
      APP_ONLYOFFICE_CALLBACK_BASE_URL: ${APP_ONLYOFFICE_CALLBACK_BASE_URL:-http://backend:5000/api}
      APP_ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-EQMS_DEV_ONLYOFFICE_JWT_SECRET_CHANGE_ME}
      # Controlled-copy evidence uploads (Report Lost/Damaged) are scanned before storage.
      # The scanner fails closed: if it cannot be reached, uploads are rejected, not allowed
      # through silently. Set to "false" only for environments that intentionally run without
      # the bundled clamav service.
      APP_SECURITY_VIRUS_SCAN_ENABLED: ${APP_SECURITY_VIRUS_SCAN_ENABLED:-true}
      APP_SECURITY_VIRUS_SCAN_HOST: clamav
      APP_SECURITY_VIRUS_SCAN_PORT: 3310
    ports:
      # Local operator/debug access only.  The GMP reverse proxy reaches this service on
      # Docker's internal network; publishing it on every host interface would bypass that
      # perimeter (and any TLS/header/rate controls installed there).
      - "127.0.0.1:${BACKEND_PORT:-5000}:5000"
    volumes:
      - eqms_backend_storage:/app/storage
      - eqms_backend_logs:/app/logs
    networks:
      - default
      - backup-net
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

  frontend:
    <<: *default-resources
    build:
      context: ./eqms
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${FRONTEND_BUILD_IMAGE:-mirror.gcr.io/library/node:22-alpine}
    image: ${EQMS_FRONTEND_IMAGE:-eqms-frontend:local}
    container_name: ${EQMS_CONTAINER_PREFIX:-eqms}-frontend
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      backend:
        condition: service_started
    environment:
      # Keep browser API calls same-origin. Vite proxies /api to the backend service
      # over the internal Docker network, so a host-side backend port issue cannot
      # make the login page report a generic network error.
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
      VITE_API_PROXY_TARGET: ${VITE_API_PROXY_TARGET:-http://backend:5000}
      VITE_APP_URL: ${VITE_APP_URL:-http://localhost:3000}
      VITE_APP_ENV: ${VITE_APP_ENV:-development}
      VITE_AUTH_TOKEN_KEY: ${VITE_AUTH_TOKEN_KEY:-authToken}
      # Browser-reachable address for the OnlyOffice DocsAPI script + iframe content -- distinct
      # from the backend's APP_ONLYOFFICE_DOCUMENT_SERVER_URL, which is the container-to-container
      # (internal Docker network) address the backend uses when building editor configs.
      VITE_ONLYOFFICE_URL: ${VITE_ONLYOFFICE_URL:-http://localhost:8082}
    ports:
      # Keep the development UI local; production traffic must enter through the approved
      # HTTPS edge/proxy rather than a directly exposed Vite/Nginx application port.
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"

networks:
  # The backup network has no route to the internet: the control database and the agent talk only to each other, to the
  # eQMS backend and (the agent) to PostgreSQL over the default network.
  backup-net:
    internal: true

secrets:
  backup_gpg_public:
    file: ${BACKUP_GPG_PUBLIC_KEY_FILE:-./backups/dev-keys/public.asc}

volumes:
  eqms_backup_control_data:
  eqms_backup_t3_data:
  eqms_postgres_data:
  eqms_minio_data:
  eqms_redis_data:
  eqms_backend_storage:
  eqms_backend_logs:
  eqms_onlyoffice_data:
  eqms_onlyoffice_logs:
  eqms_clamav_data:
