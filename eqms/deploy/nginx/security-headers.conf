# Included by every location (nginx does not inherit add_header into a location that sets its own).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

# Report-Only first: it lists what the policy WOULD block in the browser console without breaking anything.
# After a full click-through of the app (PDF viewer, OnlyOffice editor, uploads) with no violations, rename the
# header to Content-Security-Policy to enforce it. 'unsafe-inline' for scripts is needed only for the small
# viewport script in index.html; styles are inline (Tailwind/animations).
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' ${ONLYOFFICE_ORIGIN}; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: ${API_ORIGIN}; connect-src 'self' ${API_ORIGIN} ${ONLYOFFICE_ORIGIN} ws: wss:; frame-src 'self' blob: ${ONLYOFFICE_ORIGIN} ${API_ORIGIN}; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
